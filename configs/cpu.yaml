# CPU profile — no GPU available.
# Model: SmolLM2-135M-Instruct (ungated, Apache-2.0). fp32 only (CPU has no mixed precision).
profile: cpu
run:
  seed: 42
  train_seeds: [42]
  tag: cpu-smollm2-135m
model:
  name: HuggingFaceTB/SmolLM2-135M-Instruct
  max_seq_len: 320
  load_dtype: auto
data:
  dataset: b-mc2/sql-create-context
  # Budget-scaled for a 2 vCPU / 3 GB RAM box. See PROGRESS.md for the timing justification.
  train_size: 1200
  val_size: 200
  test_size: 200
  min_answer_chars: 5
  max_answer_chars: 512
  max_prompt_chars: 2400
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
training:
  num_train_epochs: 3
  max_steps: 300
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 0.3
  gradient_checkpointing: false
  eval_steps: 100
  logging_steps: 10
  save_total_limit: 1
  loss_masking: completion
eval:
  max_new_tokens: 64
  batch_size: 8
  bootstrap_resamples: 1000
  exec_timeout_s: 2.0
  few_shot_k: 3
  arc_subset: 100
  wikitext_slice: 24
efficiency:
  latency_repeats: 8
  batch_size: 1
